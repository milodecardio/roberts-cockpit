<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roberts Cockpit – Steuerung & Priorisierung</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#171b2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
  :root{
    --bg:#0f1220;--panel:#171b2e;--panel2:#1e2440;--line:#2b3357;--txt:#e8ebf7;--mut:#9aa3c7;
    --acc:#6ea8fe;--acc2:#9b8cff;
    --steuer:#ff7a7a;--lehre:#7ee0a6;--crm:#5cc8ff;--arch:#b69cff;--finanz:#ffcc66;--vision:#8a93b5;
    --hoch:#ff7a7a;--mittel:#ffcc66;--niedrig:#7ee0a6;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14.5px;line-height:1.45}
  header{padding:12px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:rgba(15,18,32,.95);backdrop-filter:blur(8px);z-index:40}
  header h1{font-size:18px;margin:0;font-weight:650}
  header .sub{color:var(--mut);font-size:12px}
  .spacer{flex:1}
  .btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:7px 12px;border-radius:9px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--acc)}
  .btn.primary{background:var(--acc);color:#0b1020;border-color:var(--acc);font-weight:600}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
  /* Nav / Filters */
  nav{display:flex;gap:4px;padding:9px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel);align-items:center}
  nav button{background:transparent;border:none;color:var(--mut);padding:7px 13px;border-radius:9px;cursor:pointer;font-size:13.5px}
  nav button.active{background:var(--panel2);color:var(--txt);font-weight:600}
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--bg)}
  .chip{padding:4px 10px;border-radius:20px;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer}
  .chip.active{color:var(--txt);border-color:var(--acc)}
  .chip .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  #search{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:6px 10px;border-radius:8px;font-size:13px;min-width:180px}
  main{padding:16px 22px 40px}
  /* Board */
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:280px;max-width:300px;flex:0 0 auto;display:flex;flex-direction:column;max-height:calc(100vh - 220px)}
  .col.over{border-color:var(--acc)}
  .col h2{font-size:12.5px;margin:0;padding:11px 12px 7px;display:flex;align-items:center;gap:5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);flex-wrap:nowrap}
  .col h2 .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .col h2 .cnt{background:var(--panel2);border-radius:20px;padding:1px 7px;font-size:11px;color:var(--txt);flex-shrink:0}
  .col .drop{padding:6px 10px 10px;overflow-y:auto;flex:1;min-height:40px}
  .col.heute h2{color:#ff9a9a}.col.woche h2{color:#9fe3bf}.col.naechstes h2{color:#8fc4ff}.col.spaeter h2{color:#c3b3ff}.col.geparkt h2{color:var(--vision)}.col.erledigt h2{color:#7ee0a6}
  /* Sort buttons */
  .sort-btns{display:flex;gap:3px;flex-shrink:0}
  .sort-btn{background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:5px;padding:1px 5px;font-size:10px;cursor:pointer;text-transform:none;letter-spacing:0;line-height:1.6;white-space:nowrap}
  .sort-btn:hover{border-color:var(--acc);color:var(--txt)}
  /* Cards */
  .card{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;cursor:grab;transition:border-top .1s}
  .card:hover{border-color:var(--acc)}
  .card.dragging{opacity:.45;cursor:grabbing}
  .card.drag-over{border-top:2px solid var(--acc)}
  .card .t{font-weight:600;font-size:13.5px;margin-bottom:6px}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px}
  .card .note{font-size:12px;color:var(--mut)}
  .card .src{font-size:10.5px;color:var(--mut);margin-top:6px;font-style:italic}
  .card .sub-t{font-size:10.5px;color:var(--mut);margin:-2px 0 6px}
  .card .owner{font-size:10.5px;color:var(--mut)}
  .card .note{white-space:pre-line}
  .subfilters{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-top:4px}
  .col.eingang h2{color:var(--txt)}
  .prio{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px}
  .prio.Hoch{background:rgba(255,122,122,.18);color:var(--hoch)}
  .prio.Mittel{background:rgba(255,204,102,.18);color:var(--mittel)}
  .prio.Niedrig{background:rgba(126,224,166,.16);color:var(--niedrig)}
  .addcard{width:100%;background:transparent;border:1px dashed var(--line);color:var(--mut);border-radius:9px;padding:7px;cursor:pointer;font-size:12.5px;margin-top:2px}
  .addcard:hover{border-color:var(--acc);color:var(--txt)}
  /* Context tab */
  .ctx{max-width:1000px}
  .ctx h2{font-size:16px;margin:22px 0 6px;color:var(--acc)}
  .ctx h2:first-child{margin-top:4px}
  .ctx p,.ctx li{font-size:14px;color:var(--txt)}
  .ctx .card-ctx{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
  .ctx .mut{color:var(--mut);font-size:13px}
  .ctx ul{margin:6px 0;padding-left:20px}.ctx li{margin:3px 0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(5,7,15,.6);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:50px 16px;overflow:auto}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:520px}
  .modal h3{margin:0 0 12px}
  label{display:block;font-size:12px;color:var(--mut);margin:9px 0 3px;font-weight:600}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:14px;font-family:inherit}
  textarea{resize:vertical;min-height:48px}
  .frow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .banner{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc2);border-radius:12px;padding:12px 15px;margin-bottom:14px;font-size:13.5px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);color:var(--txt);padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:200}
  #toast.show{opacity:1}
  @media(max-width:760px){.grid2,.frow{grid-template-columns:1fr}}
</style>
</head>

  {id:"c33",col:"erledigt",cat:"b1",sub:"B1.9 Cockpit",prio:"Mittel",t:"4 Claude-Chats importiert",note:"ChatGPT organization cockpit, Custom agent system prompt, Outlook email agent + Material.",src:"dieser Chat"},
];

// ─── State ───────────────────────────────────────────────
const KEY="robert_cockpit_v2";
let state={cards:[]};
let _ts=0;

function loadLocal(){
  try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r));}catch(e){}
  return {cards:structuredClone(SEED),_ts:0};
}

function save(){
  _ts=Date.now();
  state._ts=_ts;
  localStorage.setItem(KEY,JSON.stringify(state));
  fetch('/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)}).catch(()=>{});
}

function migrate(s){
  if(!s||!s.cards)return s;
  s.cards.forEach(function(c){if(!c.tools){c.tools=c.tool?[c.tool]:[];}delete c.tool;});
  return s;
}
async function initState(){
  try{
    const r=await fetch('/state');
    if(r.ok){const d=await r.json();if(d&&d.cards){const m=migrate(d);state=m;_ts=m._ts||0;localStorage.setItem(KEY,JSON.stringify(state));render();}}
  }catch(e){}
}

let _poll=null;
function startPoll(){
  if(_poll)return;
  _poll=setInterval(async()=>{
    try{
      const r=await fetch('/state');
      if(r.ok){
        const d=await r.json();
        if(d&&d.cards&&(d._ts||0)>_ts+1000){
          state=d;_ts=d._ts||0;
          localStorage.setItem(KEY,JSON.stringify(state));
          render();toast('🔄 Aktualisiert vom Server');
        }
      }
    }catch(e){}
  },10000);
}

// ─── Nav & Filters ───────────────────────────────────────
let activeView="board",filterCat="alle",filterSub="alle",searchQ="";

const VIEWS=[["board","🗂 Kanban"],["ctx","📋 Kontext & Anforderungen"]];
function renderNav(){
  document.getElementById("nav").innerHTML=
    VIEWS.map(([id,l])=>`<button class="${id===activeView?'active':''}" onclick="setView('${id}')">${l}</button>`).join("");
}
function setView(v){activeView=v;renderNav();render();}
function renderFilters(){
  const f=document.getElementById("filters");
  if(activeView!=="board"){f.style.display="none";return;}
  f.style.display="flex";
  let html=`<span class="chip ${filterCat==='alle'?'active':''}" onclick="setFilter('alle')">Alle</span>`;
  for(const k in CATS) html+=`<span class="chip ${filterCat===k?'active':''}" onclick="setFilter('${k}')"><span class="d" style="background:${CATS[k][1]}"></span>${CATS[k][0]}</span>`;
  html+=`<input id="search" placeholder="🔍 suchen…" value="${esc(searchQ)}" oninput="searchQ=this.value;render()">`;
  const subs=[...new Set(state.cards.filter(c=>c.cat===filterCat&&c.sub).map(c=>c.sub))].sort((a,b)=>a.localeCompare(b,"de",{numeric:true}));
  if(subs.length){
    html+=`<div class="subfilters"><span class="chip ${filterSub==='alle'?'active':''}" onclick="setSub('alle')">Alle Unterthemen</span>`;
    subs.forEach((s,i)=>html+=`<span class="chip ${filterSub===s?'active':''}" onclick="setSub(${i})">${esc(s)}</span>`);
    html+=`</div>`;
  }
  _subs=subs;
  f.innerHTML=html;
}
let _subs=[];
function setFilter(c){filterCat=c;filterSub="alle";render();}
function setSub(i){filterSub=i==="alle"?"alle":_subs[i];render();}
function render(){
  renderFilters();
  document.getElementById("view").innerHTML=activeView==="board"?renderBoard():renderCtx();
  if(activeView==="board")setTimeout(()=>{const s=document.getElementById("search");if(s&&searchQ){s.focus();s.setSelectionRange(s.value.length,s.value.length);}},0);
}
function visible(c){
  if(filterCat!=="alle"&&c.cat!==filterCat)return false;
  if(filterSub!=="alle"&&c.sub!==filterSub)return false;
  if(searchQ){const q=searchQ.toLowerCase();return(c.t+" "+(c.note||"")+" "+(c.src||"")+" "+(c.sub||"")+" "+(c.owner||"")).toLowerCase().includes(q);}
  return true;
}

// ─── Board ───────────────────────────────────────────────
function renderBoard(){
  let html=`<div class="banner">Neue Aufgaben landen im <b>📥 Eingang</b> – von dort per Drag&Drop einsortieren. Bereich wählen, dann nach <b>Unterthema</b> filtern. Karten mit Tool-Bezug haben einen <b>▶-Button</b>. <b>⇅ Prio / ⇅ Kat</b> sortiert die Spalte. Karten per Drag&Drop zwischen und <em>innerhalb</em> von Spalten verschieben.</div><div class="board">`;
  for(const [id,label] of COLS){
    const cards=state.cards.filter(c=>c.col===id&&visible(c));
    html+=`<div class="col ${id}"
      ondragover="event.preventDefault();this.classList.add('over')"
      ondragleave="this.classList.remove('over')"
      ondrop="onDropCol(event,'${id}')">
      <h2>
        <span class="lbl">${label}</span>
        <span class="sort-btns">
          <button class="sort-btn" onclick="event.stopPropagation();sortColByPrio('${id}')">⇅ Prio</button>
          <button class="sort-btn" onclick="event.stopPropagation();sortColByCat('${id}')">⇅ Kat</button>
        </span>
        <span class="cnt">${cards.length}</span>
      </h2>
      <div class="drop">${cards.map(cardHTML).join("")}<button class="addcard" onclick="editCard(null,'${id}')">+ Karte</button></div>
    </div>`;
  }
  return html+`</div>`;
}

function cardHTML(c){
  const cat=CATS[c.cat]||["?","var(--line)"];
  return `<div class="card" draggable="true" style="border-left-color:${cat[1]}"
    ondragstart="onDragStart(event,'${c.id}')"
    ondragend="onDragEnd(event)"
    ondragover="onDragOver(event,'${c.id}')"
    ondragleave="this.classList.remove('drag-over')"
    ondrop="onDropCard(event,'${c.id}')"
    onclick="editCard('${c.id}')">
    <div class="t">${esc(c.t)}</div>
    <div class="meta"><span class="tag" style="background:${hexa(cat[1])};color:${cat[1]}">${cat[0]}</span><span class="prio ${c.prio}">${c.prio}</span>${c.owner&&c.owner!=="Robert"?`<span class="owner">👤 ${esc(c.owner)}</span>`:""}</div>
    ${c.sub?`<div class="sub-t">${esc(c.sub)}</div>`:""}
    ${c.note?`<div class="note">${esc(c.note)}</div>`:""}
    ${c.src?`<div class="src">${esc(c.src)}</div>`:""}
  </div>`;
}

function hexa(v){
  const m=/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(v);
  return m?`rgba(${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)},.16)`:"var(--panel)";
}

// ─── Drag & Drop ─────────────────────────────────────────
let dragId=null;

function onDragStart(e,id){
  dragId=id;
  e.dataTransfer.effectAllowed="move";
  setTimeout(()=>e.target.classList.add('dragging'),0);
}
function onDragEnd(e){
  e.target.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));
}
function onDragOver(e,targetId){
  e.preventDefault();
  e.stopPropagation();
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  if(dragId!==targetId)e.currentTarget.classList.add('drag-over');
}
function onDropCard(e,targetId){
  e.preventDefault();
  e.stopPropagation();
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  if(!dragId||dragId===targetId){dragId=null;return;}
  const fromIdx=state.cards.findIndex(x=>x.id===dragId);
  const targetCard=state.cards.find(x=>x.id===targetId);
  if(fromIdx<0||!targetCard){dragId=null;return;}
  const dragCard=state.cards[fromIdx];
  dragCard.col=targetCard.col;
  state.cards.splice(fromIdx,1);
  const newTo=state.cards.findIndex(x=>x.id===targetId);
  state.cards.splice(newTo,0,dragCard);
  save();render();dragId=null;
}
function onDropCol(e,col){
  e.preventDefault();
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));
  if(!dragId)return;
  const c=state.cards.find(x=>x.id===dragId);
  if(c){c.col=col;save();render();}
  dragId=null;
}

// ─── Sort ─────────────────────────────────────────────────
function sortColByPrio(col){
  const o={Hoch:0,Mittel:1,Niedrig:2};
  const sorted=state.cards.filter(c=>c.col===col).sort((a,b)=>(o[a.prio]||99)-(o[b.prio]||99));
  state.cards=[...state.cards.filter(c=>c.col!==col),...sorted];
  save();render();
}
function sortColByCat(col){
  const key=c=>(c.cat||'')+" "+(c.sub||'')+" "+c.t;
  const sorted=state.cards.filter(c=>c.col===col).sort((a,b)=>key(a).localeCompare(key(b),"de",{numeric:true}));
  state.cards=[...state.cards.filter(c=>c.col!==col),...sorted];
  save();render();
}

let toastT=null;
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2600);}

// ─── Modal ────────────────────────────────────────────────
const M=document.getElementById("modalBg");
M.addEventListener("click",e=>{if(e.target===M)closeM();});
function closeM(){M.classList.remove("open");document.getElementById("modal").innerHTML="";}
function uid(){return "c"+Math.random().toString(36).slice(2,8);}
function editCard(id,col){
  const c=id?state.cards.find(x=>x.id===id):{id:uid(),col:col||"eingang",cat:filterCat in CATS?filterCat:"b1",sub:filterSub!=="alle"?filterSub:"",owner:"Robert",prio:"Mittel",t:"",note:"",src:"",tools:[]};
  const subOpts=[...new Set(state.cards.filter(x=>x.sub).map(x=>x.sub))].sort().map(s=>`<option value="${esc(s)}">`).join("");
  const catOpts=Object.keys(CATS).map(k=>`<option value="${k}" ${k===c.cat?'selected':''}>${CATS[k][0]}</option>`).join("");
  const colOpts=COLS.map(([k,l])=>`<option value="${k}" ${k===c.col?'selected':''}>${l}</option>`).join("");
  const prioOpts=PRIOS.map(p=>`<option ${p===c.prio?'selected':''}>${p}</option>`).join("");
  document.getElementById("modal").innerHTML=`<h3>${id?"Karte bearbeiten":"Neue Karte"}</h3>
    <label>Titel</label><input id="m_t" value="${esc(c.t)}">
    <label>Notiz / Nächster Schritt</label><textarea id="m_note">${esc(c.note)}</textarea>
    <div class="frow"><div><label>Spalte</label><select id="m_col">${colOpts}</select></div>
    <div><label>Kategorie</label><select id="m_cat">${catOpts}</select></div>
    <div><label>Priorität</label><select id="m_prio">${prioOpts}</select></div></div>
    <div class="grid2"><div><label>Unterthema</label><input id="m_sub" list="m_subs" value="${esc(c.sub||'')}"><datalist id="m_subs">${subOpts}</datalist></div>
    <div><label>Zuständig</label><input id="m_owner" value="${esc(c.owner||'')}"></div></div>
    <label>Quelle</label><input id="m_src" value="${esc(c.src||'')}">
    <div class="modal-actions">${id?`<button class="btn" style="margin-right:auto;color:var(--steuer)" onclick="delCard('${c.id}')">Löschen</button>`:""}
      <button class="btn" onclick="closeM()">Abbrechen</button>
      <button class="btn primary" onclick="saveCard('${c.id}',${!!id})">Speichern</button></div>`;
  M.classList.add("open");
}
function saveCard(cid,exists){
  const g=i=>document.getElementById(i).value;
  const obj={id:cid,col:g("m_col"),cat:g("m_cat"),sub:g("m_sub").trim(),owner:g("m_owner").trim(),prio:g("m_prio"),t:g("m_t").trim()||"Unbenannt",note:g("m_note"),src:g("m_src")};
  if(exists){const i=state.cards.findIndex(x=>x.id===cid);state.cards[i]={...state.cards[i],...obj};}else state.cards.push({tools:[],...obj});
  save();closeM();render();
}
function delCard(id){if(!confirm("Karte löschen?"))return;state.cards=state.cards.filter(x=>x.id!==id);save();closeM();render();}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// ─── Backup / Import / Reset ─────────────────────────────
function exportData(){const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="cockpit_backup.json";a.click();URL.revokeObjectURL(u);}
function importData(){document.getElementById("fileIn").click();}
document.getElementById("fileIn").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{state=JSON.parse(r.result);if(!state.cards)throw 0;save();render();toast("Import erfolgreich.");}catch(x){toast("Datei konnte nicht gelesen werden.");}};
  r.readAsText(f);
});
function resetData(){if(!confirm("Auf Standard-Karten zurücksetzen? Deine Änderungen gehen verloren."))return;state={cards:structuredClone(SEED)};save();render();}
