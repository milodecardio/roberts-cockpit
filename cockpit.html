<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roberts Cockpit – Steuerung & Priorisierung</title>
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<meta name="theme-color" content="#171b2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
  :root{
    --bg:#0f1220;--panel:#171b2e;--panel2:#1e2440;--line:#2b3357;--txt:#e8ebf7;--mut:#9aa3c7;
    --acc:#6ea8fe;--acc2:#9b8cff;
    --steuer:#ff7a7a;--lehre:#7ee0a6;--crm:#5cc8ff;--arch:#b69cff;--finanz:#ffcc66;--vision:#8a93b5;
    --hoch:#ff7a7a;--mittel:#ffcc66;--niedrig:#7ee0a6;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14.5px;line-height:1.45}
  header{padding:12px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:rgba(15,18,32,.95);backdrop-filter:blur(8px);z-index:40}
  header h1{font-size:18px;margin:0;font-weight:650}
  header .sub{color:var(--mut);font-size:12px}
  .spacer{flex:1}
  .btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:7px 12px;border-radius:9px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--acc)}
  .btn.primary{background:var(--acc);color:#0b1020;border-color:var(--acc);font-weight:600}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
  /* Nav / Filters */
  nav{display:flex;gap:4px;padding:9px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel);align-items:center}
  nav button{background:transparent;border:none;color:var(--mut);padding:7px 13px;border-radius:9px;cursor:pointer;font-size:13.5px}
  nav button.active{background:var(--panel2);color:var(--txt);font-weight:600}
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--bg)}
  .chip{padding:4px 10px;border-radius:20px;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer}
  .chip.active{color:var(--txt);border-color:var(--acc)}
  .chip .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  #search{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:6px 10px;border-radius:8px;font-size:13px;min-width:180px}
  main{padding:16px 22px 40px}
  /* Board */
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:280px;max-width:300px;flex:0 0 auto;display:flex;flex-direction:column;max-height:calc(100vh - 220px)}
  .col.over{border-color:var(--acc)}
  .col h2{font-size:12.5px;margin:0;padding:11px 12px 7px;display:flex;align-items:center;gap:5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);flex-wrap:nowrap}
  .col h2 .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .col h2 .cnt{background:var(--panel2);border-radius:20px;padding:1px 7px;font-size:11px;color:var(--txt);flex-shrink:0}
  .col .drop{padding:6px 10px 10px;overflow-y:auto;flex:1;min-height:40px}
  .col.heute h2{color:#ff9a9a}.col.woche h2{color:#9fe3bf}.col.naechstes h2{color:#8fc4ff}.col.spaeter h2{color:#c3b3ff}.col.geparkt h2{color:var(--vision)}.col.erledigt h2{color:#7ee0a6}
  /* Sort buttons */
  .sort-btns{display:flex;gap:3px;flex-shrink:0}
  .sort-btn{background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:5px;padding:1px 5px;font-size:10px;cursor:pointer;text-transform:none;letter-spacing:0;line-height:1.6;white-space:nowrap}
  .sort-btn:hover{border-color:var(--acc);color:var(--txt)}
  /* Cards */
  .card{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;cursor:grab;transition:border-top .1s}
  .card:hover{border-color:var(--acc)}
  .card.dragging{opacity:.45;cursor:grabbing}
  .card.drag-over{border-top:2px solid var(--acc)}
  .card .t{font-weight:600;font-size:13.5px;margin-bottom:6px}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px}
  .card .note{font-size:12px;color:var(--mut)}
  .card .src{font-size:10.5px;color:var(--mut);margin-top:6px;font-style:italic}
  .card .sub-t{font-size:10.5px;color:var(--mut);margin:-2px 0 6px}
  .card .owner{font-size:10.5px;color:var(--mut)}
  .card .note{white-space:pre-line}
  .subfilters{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-top:4px}
  .col.eingang h2{color:var(--txt)}
  .prio{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px}
  .prio.Hoch{background:rgba(255,122,122,.18);color:var(--hoch)}
  .prio.Mittel{background:rgba(255,204,102,.18);color:var(--mittel)}
  .prio.Niedrig{background:rgba(126,224,166,.16);color:var(--niedrig)}
  .addcard{width:100%;background:transparent;border:1px dashed var(--line);color:var(--mut);border-radius:9px;padding:7px;cursor:pointer;font-size:12.5px;margin-top:2px}
  .addcard:hover{border-color:var(--acc);color:var(--txt)}
  /* Context tab */
  .ctx{max-width:1000px}
  .ctx h2{font-size:16px;margin:22px 0 6px;color:var(--acc)}
  .ctx h2:first-child{margin-top:4px}
  .ctx p,.ctx li{font-size:14px;color:var(--txt)}
  .ctx .card-ctx{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
  .ctx .mut{color:var(--mut);font-size:13px}
  .ctx ul{margin:6px 0;padding-left:20px}.ctx li{margin:3px 0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(5,7,15,.6);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:50px 16px;overflow:auto}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:520px}
  .modal h3{margin:0 0 12px}
  label{display:block;font-size:12px;color:var(--mut);margin:9px 0 3px;font-weight:600}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:14px;font-family:inherit}
  textarea{resize:vertical;min-height:48px}
  .frow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .banner{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc2);border-radius:12px;padding:12px 15px;margin-bottom:14px;font-size:13.5px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);color:var(--txt);padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:200}
  #toast.show{opacity:1}
  /* Materialien (Etappe 2) */
  .card .att{font-size:10.5px;color:var(--acc);font-weight:600}
  .docs{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
  .docs h4{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:8px}
  .docs .hint{font-size:12px;color:var(--mut)}
  .doc{display:flex;align-items:flex-start;gap:9px;padding:7px 8px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;background:var(--panel2)}
  .doc .ic{font-size:17px;line-height:1.2}
  .doc .bd{flex:1;min-width:0}
  .doc .bd a{color:var(--txt);text-decoration:none;font-weight:600;font-size:13px;word-break:break-word}
  .doc .bd a:hover{color:var(--acc)}
  .doc .bd .m{font-size:11px;color:var(--mut);overflow-wrap:anywhere}
  .modal{min-width:0;overflow-wrap:anywhere}
  .doc .bd .nb{font-size:12.5px;white-space:pre-wrap;margin-top:3px;max-height:7.5em;overflow:auto}
  .doc img.th{max-width:120px;max-height:80px;border-radius:6px;display:block;margin-top:5px}
  .doc .x{background:none;border:none;color:var(--mut);cursor:pointer;font-size:15px;padding:0 3px}
  .doc .x:hover{color:var(--steuer)}
  .doc-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .doc-form{margin-top:8px;padding:9px;border:1px dashed var(--line);border-radius:9px}
  .docs.dropping{outline:2px dashed var(--acc);outline-offset:4px;border-radius:8px}
  .up{font-size:12px;color:var(--mut);margin:4px 0}
  .up progress{width:100%;height:6px}
  .hits{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:10px 14px;margin-bottom:14px}
  .hits h4{margin:0 0 6px;font-size:13px;color:var(--mut)}
  .hit{font-size:13px;padding:4px 0;border-top:1px solid var(--line)}
  .hit:first-of-type{border-top:none}
  .hit a{color:var(--txt);font-weight:600;text-decoration:none}
  .hit .s{color:var(--mut);font-size:12px}
  .hit mark{background:rgba(110,168,254,.3);color:var(--txt);border-radius:3px;padding:0 1px}
  .hit .cl{color:var(--acc);cursor:pointer;font-size:12px}
  /* Etappe 3: Bibliothek, Bedeutungssuche */
  .st{font-size:11px;margin-left:4px}
  .lib{max-width:1100px}
  .lib .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .lib .bar input{max-width:360px}
  .lib .bar select{max-width:200px}
  .lib .stats{font-size:12.5px;color:var(--mut);margin-bottom:12px}
  .lib .doc .bd .s{font-size:12px;color:var(--mut);margin-top:3px}
  .lib .more{margin:10px 0}
  .rel{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .rel h4{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:600}
  .pick{max-height:50vh;overflow:auto;margin-top:8px}
  .pick .pc{padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer;font-size:13px;background:var(--panel2)}
  .pick .pc:hover{border-color:var(--acc)}
  .pick .pc small{color:var(--mut)}
  /* Etappe 5: Mails, Dateien auf Karten ziehen */
  .card.file-over{outline:2px dashed var(--acc);outline-offset:2px;background:var(--panel2)}
  .mailres{max-height:46vh;overflow:auto;margin-top:8px}
  .mailres .mr{padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:var(--panel2);font-size:13px;display:flex;gap:8px;align-items:flex-start}
  .mailres .mr .bd{flex:1;min-width:0}
  .mailres .mr small{color:var(--mut);display:block;overflow-wrap:anywhere}
  #uplFloat{position:fixed;right:16px;bottom:16px;z-index:60;max-width:min(360px,calc(100vw - 32px))}
  #uplFloat .up{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin-top:6px;color:var(--txt)}
  @media(max-width:760px){.grid2,.frow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div>
    <h1>🧭 Roberts Cockpit</h1>
    <div class="sub">Steuerungs- & Priorisierungs-Cockpit · v2.0</div>
  </div>
  <div class="spacer"></div>
  <button class="btn sm" onclick="outlookDialog()" title="Outlook-Verbindung (nur Lesen)">✉️ Outlook</button>
  <button class="btn sm" onclick="exportData()">⬇︎ Backup</button>
  <button class="btn sm" onclick="importData()">⬆︎ Import</button>
  <button class="btn sm" onclick="resetData()">↺ Standard</button>

<nav id="nav"></nav>
<div class="filters" id="filters"></div>
<main id="view"></main>

// ─── State ───────────────────────────────────────────────
const KEY="robert_cockpit_v2";
let state={cards:[]};
let _ts=0;

function loadLocal(){
  try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r));}catch(e){}
  return {cards:structuredClone(SEED),_ts:0};
}

// Speichern mit Konfliktschutz: _ts = Server-Version, auf der unser Stand beruht.
// Hat inzwischen ein anderes Gerät oder Claude gespeichert, antwortet der Server 409
// mit seinem Stand; wir führen feldweise zusammen (eigene Änderungen gewinnen) und speichern erneut.
let _base={};            // id → JSON der Karte im zuletzt bestätigten Server-Stand
let _saving=false,_dirty=false;
function snapBase(cards){_base={};(cards||[]).forEach(c=>{_base[c.id]=JSON.stringify(c);});}
function keepLocal(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

function save(){
  state._ts=_ts;
  keepLocal();
  _dirty=true;flush();
}
async function flush(){
  if(_saving||!_dirty)return;
  _saving=true;_dirty=false;
  const sent=state.cards.map(c=>({...c}));
  let again=false;
  try{
    const r=await fetch('/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cards:sent,_base:_ts})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){_ts=d._ts||_ts;state._ts=_ts;snapBase(sent);keepLocal();again=_dirty;}
    else if(r.status===409&&d.conflict&&d.state){
      const srv=migrate(d.state);
      state=mergeStates(srv);_ts=srv._ts||0;state._ts=_ts;snapBase(srv.cards);keepLocal();
      _dirty=true;again=true;render();toast('🔄 Mit Änderungen von Claude/anderem Gerät zusammengeführt');
    } else {_dirty=true;toast('⚠️ Speichern fehlgeschlagen: '+(d.error||r.status));}
  }catch(e){_dirty=true;}   // offline: nächster Abgleich versucht es erneut
  finally{_saving=false;}
  if(again)flush();
}
function mergeStates(srv){
  const srvMap=new Map(srv.cards.map(c=>[c.id,c])),localIds=new Set(state.cards.map(c=>c.id)),out=[];
  for(const c of state.cards){
    const b=_base[c.id],sc=srvMap.get(c.id);
    if(b===undefined){out.push(c);continue;}                 // lokal neu angelegt
    if(JSON.stringify(c)===b){if(sc)out.push(sc);continue;}   // lokal unverändert → Server-Stand
    if(!sc){out.push(c);continue;}                           // lokal geändert, woanders gelöscht → behalten
    const bo=JSON.parse(b),m={...sc};                        // beide geändert → feldweise
    for(const k of new Set([...Object.keys(c),...Object.keys(bo)])){
      if(JSON.stringify(c[k])!==JSON.stringify(bo[k])){if(c[k]===undefined)delete m[k];else m[k]=c[k];}
    }
    out.push(m);
  }
  for(const sc of srv.cards)if(!localIds.has(sc.id)&&_base[sc.id]===undefined)out.push(sc); // woanders neu
  return {cards:out,_ts:srv._ts};
}

function migrate(s){
  if(!s||!s.cards)return s;
  s.cards.forEach(function(c){if(!c.tools){c.tools=c.tool?[c.tool]:[];}delete c.tool;});
  return s;
}
async function initState(){
  try{
    const r=await fetch('/state');
    if(r.ok){const d=await r.json();if(d&&d.cards){const m=migrate(d);state=m;_ts=m._ts||0;snapBase(m.cards);keepLocal();render();}}
  }catch(e){}
}

let _poll=null;
function startPoll(){
  if(_poll)return;
  _poll=setInterval(async()=>{
    try{
      if(_dirty&&!_saving){flush();return;}   // nach Offline-Phase nachholen
      if(_saving)return;
      const r=await fetch('/state');
      if(r.ok&&!_saving&&!_dirty){
        const d=await r.json();
        if(d&&d.cards&&(d._ts||0)!==_ts){
          state=migrate(d);_ts=d._ts||0;snapBase(state.cards);keepLocal();
          render();loadDocCounts();toast('🔄 Aktualisiert vom Server');
        }
      }
    }catch(e){}
  },10000);
}

let activeView="board",filterCat="alle",filterSub="alle",searchQ="";

}
function setView(v){activeView=v;if(v==="lib")lib.loaded=false;renderNav();render();}
function renderFilters(){
  const f=document.getElementById("filters");

  for(const k in CATS) html+=`<span class="chip ${filterCat===k?'active':''}" onclick="setFilter('${k}')"><span class="d" style="background:${CATS[k][1]}"></span>${CATS[k][0]}</span>`;

let _subs=[];
function setFilter(c){filterCat=c;filterSub="alle";render();}
function setSub(i){filterSub=i==="alle"?"alle":_subs[i];render();}
function render(){
  renderFilters();
  document.getElementById("view").innerHTML=activeView==="board"?renderBoard():activeView==="lib"?renderLib():renderCtx();

function visible(c){
  if(filterCat!=="alle"&&c.cat!==filterCat)return false;
  if(filterSub!=="alle"&&c.sub!==filterSub)return false;
  if(searchQ){
    if(srv.q===searchQ.trim()&&srv.cards.has(c.id))return true; // Treffer über Materialien/Server-Suche
    const q=searchQ.toLowerCase();return(c.t+" "+(c.note||"")+" "+(c.src||"")+" "+(c.sub||"")+" "+(c.owner||"")).toLowerCase().includes(q);
  }
  return true;
}

// ─── Server-Suche & Materialien (Etappe 2) ───────────────
let srv={q:"",cards:new Set(),docs:[]},_srvT=null,docCounts={};
function serverSearch(){
  clearTimeout(_srvT);
  const q=searchQ.trim();
  if(!q){srv={q:"",cards:new Set(),docs:[]};sem={q:"",cards:[],docs:[]};return;}
  _srvT=setTimeout(async()=>{
    try{
      const r=await fetch('/api/search?q='+encodeURIComponent(q));
      if(!r.ok)return;
      const d=await r.json();
      if(searchQ.trim()!==q)return;
      srv={q,cards:new Set(d.cards),docs:d.docs};
      render();
    }catch(e){}
    // Bedeutungssuche (bge-m3) – etwas langsamer, kommt hinterher
    try{
      const r=await fetch('/api/semantic?q='+encodeURIComponent(q));
      if(!r.ok)return;
      const d=await r.json();
      if(searchQ.trim()!==q||!d.available)return;
      sem={q,cards:d.cards,docs:d.docs};
      render();
    }catch(e){}
  },400);
}
let sem={q:"",cards:[],docs:[]};
function semHTML(){
  if(!searchQ.trim()||sem.q!==searchQ.trim())return"";
  const seenDocs=new Set(srv.docs.map(d=>d.id));
  const docs=sem.docs.filter(d=>!seenDocs.has(d.id)&&d.score>=0.40).slice(0,8);
  const cards=sem.cards.filter(c=>c.score>=0.45).map(c=>state.cards.find(x=>x.id===c.id)).filter(Boolean).slice(0,6);
  if(!docs.length&&!cards.length)return"";
  return `<div class="hits" style="border-left-color:var(--acc2)"><h4>🧠 Ähnliche Bedeutung</h4>
    ${cards.length?`<div class="hit"><span class="s">Karten:</span> ${cards.map(c=>`<span class="cl" onclick="editCard('${c.id}')">${esc(c.t)}</span>`).join(" · ")}</div>`:""}
    ${docs.map(d=>{const cs=d.cards.map(id=>state.cards.find(c=>c.id===id)).filter(Boolean);
      return `<div class="hit">${d.kind==="file"?fileIcon(d.mime):DOC_IC[d.kind]} ${docLink(d)}
        <div class="s">${esc(d.snippet)}</div>
        <div>${cs.map(c=>`<span class="cl" onclick="editCard('${c.id}')">→ ${esc(c.t)}</span>`).join(" · ")}
        <span class="cl" onclick="pickCard(${d.id})">＋ an Karte hängen</span></div></div>`;}).join("")}
  </div>`;
}
async function loadDocCounts(){
  try{const r=await fetch('/api/doc-counts');if(r.ok){docCounts=await r.json();if(activeView==="board")render();}}catch(e){}
}
function hitsHTML(){
  if(!searchQ.trim()||srv.q!==searchQ.trim()||!srv.docs.length)return"";
  const mark=s=>esc(s||"").replace(/\u0002/g,"<mark>").replace(/\u0003/g,"</mark>");
  return `<div class="hits"><h4>📎 Treffer in Materialien (${srv.docs.length})</h4>${srv.docs.map(d=>{
    const cards=d.cards.map(id=>state.cards.find(c=>c.id===id)).filter(Boolean);
    return `<div class="hit">${DOC_IC[d.kind]||"📄"} ${docLink(d)}
      ${d.snippet?`<div class="s">${mark(d.snippet)}</div>`:""}
      <div>${cards.map(c=>`<span class="cl" onclick="editCard('${c.id}')">→ ${esc(c.t)}</span>`).join(" · ")}</div></div>`;
  }).join("")}</div>`;
}

function cardHTML(c){
  const cat=CATS[c.cat]||["?","var(--line)"];
  return `<div class="card" draggable="true" style="border-left-color:${cat[1]}"
    ondragstart="onDragStart(event,'${c.id}')"
    ondragend="onDragEnd(event)"
    ondragover="onDragOver(event,'${c.id}')"
    ondragleave="this.classList.remove('drag-over')"
    ondrop="onDropCard(event,'${c.id}')"
    onclick="editCard('${c.id}')">
    <div class="t">${esc(c.t)}</div>
    <div class="meta"><span class="tag" style="background:${hexa(cat[1])};color:${cat[1]}">${cat[0]}</span><span class="prio ${c.prio}">${c.prio}</span>${c.owner&&c.owner!=="Robert"?`<span class="owner">👤 ${esc(c.owner)}</span>`:""}${docCounts[c.id]?`<span class="att">📎 ${docCounts[c.id]}</span>`:""}</div>
    ${c.sub?`<div class="sub-t">${esc(c.sub)}</div>`:""}

  </div>`;
}

function hexa(v){
  const m=/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(v);
  return m?`rgba(${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)},.16)`:"var(--panel)";
}

// ─── Drag & Drop ─────────────────────────────────────────
let dragId=null;

function onDragStart(e,id){
  dragId=id;
  e.dataTransfer.effectAllowed="move";
  setTimeout(()=>e.target.classList.add('dragging'),0);
}
function onDragEnd(e){
  e.target.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));
}
// Etappe 5: Von außen gezogen (Datei, Mail, Link) – nicht eine Karte aus dem Board
function isExternalDrag(e){
  if(dragId)return false;
  const t=Array.from((e.dataTransfer&&e.dataTransfer.types)||[]);
  return t.includes("Files")||t.includes("text/uri-list")||t.includes("text/plain");
}
function onDragOver(e,targetId){
  e.preventDefault();
  e.stopPropagation();
  document.querySelectorAll('.drag-over,.file-over').forEach(el=>el.classList.remove('drag-over','file-over'));
  if(isExternalDrag(e)){e.dataTransfer.dropEffect="copy";e.currentTarget.classList.add('file-over');return;}
  if(dragId!==targetId)e.currentTarget.classList.add('drag-over');
}
function onDropCard(e,targetId){
  e.preventDefault();
  e.stopPropagation();
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));
  document.querySelectorAll('.drag-over,.file-over').forEach(el=>el.classList.remove('drag-over','file-over'));
  if(!dragId){dropOnCard(targetId,e.dataTransfer);return;}
  if(dragId===targetId){dragId=null;return;}
  const fromIdx=state.cards.findIndex(x=>x.id===dragId);
  const targetCard=state.cards.find(x=>x.id===targetId);
  if(fromIdx<0||!targetCard){dragId=null;return;}
  const dragCard=state.cards[fromIdx];
  dragCard.col=targetCard.col;
  state.cards.splice(fromIdx,1);
  const newTo=state.cards.findIndex(x=>x.id===targetId);
  state.cards.splice(newTo,0,dragCard);
  save();render();dragId=null;
}
function onDropCol(e,col){
  e.preventDefault();
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));
  if(!dragId){if(e.dataTransfer&&e.dataTransfer.types.length)toast("Dateien und Mails bitte direkt auf eine Karte ziehen");return;}
  const c=state.cards.find(x=>x.id===dragId);
  if(c){c.col=col;save();render();}
  dragId=null;
}

async function dropOnCard(cid,dt){
  const c=state.cards.find(x=>x.id===cid);if(!c||!dt)return;
  if(_dirty||!_base[cid]){await flush();}
  if(dt.files&&dt.files.length){uploadFiles(cid,dt.files);return;}
  const uri=(dt.getData("text/uri-list")||"").split(/\r?\n/).find(l=>l&&!l.startsWith("#"))||"";
  const txt=(dt.getData("text/plain")||"").trim();
  const url=/^https?:\/\//i.test(uri)?uri:/^https?:\/\/\S+$/i.test(txt)?txt:"";
  if(url){
    try{
      const r=await fetch(`/api/cards/${encodeURIComponent(cid)}/links`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url,title:""})});
      const d=await r.json();
      if(!r.ok){toast("⚠️ "+(d.error||"Fehler"));return;}
      docCounts[cid]=(docCounts[cid]||0)+1;render();toast("🔗 Link an „"+c.t.slice(0,40)+"“ gehängt");
    }catch(e){toast("⚠️ Keine Verbindung zum Server");}
    return;
  }
  toast("Das lässt sich nicht direkt übernehmen – Mail in Outlook als Datei sichern oder in der Karte „✉️ Mail aus Outlook“ nutzen");
}
// Dateien, die neben eine Karte fallen, nicht im Browser öffnen (würde das Cockpit verlassen)
window.addEventListener("dragover",e=>{if(isExternalDrag(e))e.preventDefault();});
window.addEventListener("drop",e=>{if(isExternalDrag(e))e.preventDefault();});

// ─── Sort ─────────────────────────────────────────────────
function sortColByPrio(col){
  const o={Hoch:0,Mittel:1,Niedrig:2};
  const sorted=state.cards.filter(c=>c.col===col).sort((a,b)=>(o[a.prio]||99)-(o[b.prio]||99));
  state.cards=[...state.cards.filter(c=>c.col!==col),...sorted];
  save();render();
}
function sortColByCat(col){
  const key=c=>(c.cat||'')+" "+(c.sub||'')+" "+c.t;
  const sorted=state.cards.filter(c=>c.col===col).sort((a,b)=>key(a).localeCompare(key(b),"de",{numeric:true}));
  state.cards=[...state.cards.filter(c=>c.col!==col),...sorted];
  save();render();
}

// ─── Etappe 3: „Passend dazu“, Bibliothek, an Karte hängen ─────────
function statusBadge(d){
  if(d.kind!=="file")return"";
  const s=d.text_status;
  return s==="pending"?`<span class="st" title="Text wird gerade ausgelesen">⏳ wird ausgelesen</span>`
    :s==="failed"?`<span class="st" title="${esc(d.text_error||"")}">⚠️ nicht lesbar</span>`
    :s==="skipped"?`<span class="st" title="${esc(d.text_error||"")}">ⓘ nur Titel durchsuchbar</span>`:"";
}
async function loadRelated(cid){
  const el=document.getElementById("rel");if(!el)return;
  try{
    const r=await fetch(`/api/cards/${encodeURIComponent(cid)}/related`);
    if(!r.ok)return;
    const d=await r.json();
    if(!document.getElementById("rel"))return;
    if(!d.available){el.innerHTML="";return;}
    const docs=d.docs.filter(x=>x.score>=0.40);
    const cards=d.cards.filter(x=>x.score>=0.50).map(x=>state.cards.find(c=>c.id===x.id)).filter(Boolean);
    if(!docs.length&&!cards.length){el.innerHTML="";return;}
    el.innerHTML=`<h4>🧠 Passend dazu</h4>
      ${docs.map(x=>`<div class="doc"><span class="ic">${x.kind==="file"?fileIcon(x.mime):DOC_IC[x.kind]}</span>
        <div class="bd">${docLink(x)}<div class="m">${esc((x.snippet||"").slice(0,160))}</div></div>
        <button class="btn sm" title="An diese Karte hängen" onclick="attachDoc('${cid}',${x.id})">＋</button></div>`).join("")}
      ${cards.length?`<div class="m" style="font-size:12px;margin-top:4px">Ähnliche Karten: ${cards.map(c=>`<span class="cl" style="color:var(--acc);cursor:pointer" onclick="editCard('${c.id}')">${esc(c.t)}</span>`).join(" · ")}</div>`:""}`;
  }catch(e){}
}
async function attachDoc(cid,docId,quiet){
  try{
    const r=await fetch(`/api/cards/${encodeURIComponent(cid)}/attach`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({doc_id:docId})});
    const d=await r.json();
    if(!r.ok){toast("⚠️ "+(d.error||"Fehler"));return false;}
    toast("📎 An Karte gehängt");
    docCounts[cid]=(docCounts[cid]||0)+1;
    if(!quiet&&document.getElementById("docList")){loadDocs(cid);loadRelated(cid);}
    return true;
  }catch(e){toast("⚠️ Keine Verbindung zum Server");return false;}
}
function pickCard(docId){
  document.getElementById("modal").innerHTML=`<h3>An welche Karte hängen?</h3>
    <input id="pk_q" placeholder="Karte suchen…" oninput="renderPick(${docId})">
    <div class="pick" id="pk_list"></div>
    <div class="modal-actions"><button class="btn" onclick="closeM()">Abbrechen</button></div>`;
  M.classList.add("open");renderPick(docId);document.getElementById("pk_q").focus();
}
function renderPick(docId){
  const q=(document.getElementById("pk_q").value||"").toLowerCase();

  document.getElementById("pk_list").innerHTML=list.map(c=>`<div class="pc" onclick="pickDone('${c.id}',${docId})">${esc(c.t)}<br><small>${esc((CATS[c.cat]||[""])[0])}${c.sub?" · "+esc(c.sub):""}</small></div>`).join("")||`<div class="hint">Keine Karte gefunden.</div>`;

async function pickDone(cid,docId){if(await attachDoc(cid,docId,true)){closeM();render();if(activeView==="lib")loadLib();}}

let lib={q:"",origin:"",status:"",items:[],total:0,loaded:false,stats:null,offset:0};
function renderLib(){
  if(!lib.loaded){setTimeout(loadLib,0);}
  const s=lib.stats;
  const n=k=>(s&&s.docs[k])||0;
  const origins=s?Object.keys(s.origins):[];
  const ON={upload:"Hochgeladen",mac:"Mac",onedrive:"OneDrive",outlook:"Outlook"};
  return `<div class="lib">
    <div class="bar">
      <input id="lib_q" placeholder="🔍 in der Bibliothek suchen…" value="${esc(lib.q)}" onkeydown="if(event.key==='Enter'){lib.q=this.value;lib.offset=0;loadLib()}">
      <select onchange="lib.origin=this.value;lib.offset=0;loadLib()"><option value="">Alle Quellen</option>${origins.map(o=>`<option value="${esc(o)}" ${lib.origin===o?"selected":""}>${esc(ON[o]||o)} (${s.origins[o]})</option>`).join("")}</select>
      <select onchange="lib.status=this.value;lib.offset=0;loadLib()">
        <option value="">Alle</option><option value="pending" ${lib.status==="pending"?"selected":""}>⏳ wird ausgelesen</option>
        <option value="done" ${lib.status==="done"?"selected":""}>✅ durchsuchbar</option>
        <option value="skipped" ${lib.status==="skipped"?"selected":""}>ⓘ nur Titel</option>
        <option value="failed" ${lib.status==="failed"?"selected":""}>⚠️ nicht lesbar</option></select>
      <button class="btn sm" onclick="lib.q=document.getElementById('lib_q').value;lib.offset=0;loadLib()">Suchen</button>
    </div>
    <div class="stats">${s?`${n("done")+n("pending")+n("skipped")+n("failed")} Materialien · ${fmtSize(s.bytes)} · ✅ ${n("done")} durchsuchbar · ⏳ ${n("pending")} in Arbeit · ⓘ ${n("skipped")} nur Titel · ⚠️ ${n("failed")} nicht lesbar · ${s.chunks} Abschnitte vektorisiert`:"lädt…"}</div>
    ${lib.items.map(d=>{const cs=d.cards.map(id=>state.cards.find(c=>c.id===id)).filter(Boolean);
      return `<div class="doc"><span class="ic">${d.kind==="file"?fileIcon(d.mime):DOC_IC[d.kind]}</span>
      <div class="bd">${docLink(d)}${statusBadge(d)}
        <div class="m">${d.origin_path?esc(d.origin_path)+" · ":""}${d.size?fmtSize(d.size)+" · ":""}${new Date(d.created_at*1000).toLocaleDateString("de-DE")}</div>
        <div class="s">${cs.map(c=>`<span class="cl" style="color:var(--acc);cursor:pointer" onclick="editCard('${c.id}')">→ ${esc(c.t)}</span>`).join(" · ")}
        <span class="cl" style="color:var(--acc);cursor:pointer" onclick="pickCard(${d.id})">＋ an Karte hängen</span></div>
      </div></div>`;}).join("")||(lib.loaded?`<div class="hint">Keine Materialien gefunden.</div>`:"")}
    ${lib.items.length<lib.total?`<button class="btn more" onclick="lib.offset+=100;loadLib(true)">Weitere laden (${lib.total-lib.items.length})</button>`:""}
  </div>`;
}
async function loadLib(append){
  try{
    const p=new URLSearchParams({q:lib.q,origin:lib.origin,status:lib.status,offset:lib.offset,limit:100});
    const [r1,r2]=await Promise.all([fetch('/api/library?'+p),fetch('/api/status')]);
    if(r1.ok){const d=await r1.json();lib.items=append?lib.items.concat(d.items):d.items;lib.total=d.total;}
    if(r2.ok)lib.stats=await r2.json();
    lib.loaded=true;
    if(activeView==="lib")render();
  }catch(e){}
}

const DOC_IC={file:"📄",link:"🔗",note:"📝"};
function fileIcon(m){m=m||"";return m.startsWith("image/")?"🖼":m.startsWith("audio/")?"🎧":m.startsWith("video/")?"🎬":m==="application/pdf"?"📕":/sheet|excel|csv/.test(m)?"📊":/word|document/.test(m)?"📘":"📄";}
function fmtSize(n){if(n==null)return"";return n<1024?n+" B":n<1048576?(n/1024).toFixed(0)+" KB":(n/1048576).toFixed(1)+" MB";}
function noteRest(d){const b=d.body||"";return b.startsWith(d.title)?b.slice(d.title.length).trim():b;}
function docHref(d){return d.kind==="file"?`/files/${d.id}/${encodeURIComponent(d.filename||"datei")}`:d.kind==="link"?d.url:"";}
function docLink(d){
  const h=docHref(d);
  return h?`<a href="${esc(h)}" target="_blank" rel="noopener noreferrer">${esc(d.title||d.filename||d.url)}</a>`:`<b>${esc(d.title)}</b>`;
}
async function loadDocs(cid){
  const el=document.getElementById("docList");if(!el)return;
  try{
    const r=await fetch(`/api/cards/${encodeURIComponent(cid)}/docs`);
    if(r.status===404){el.innerHTML=`<div class="hint">Noch keine Materialien.</div>`;return;}
    const docs=await r.json();
    docCounts[cid]=docs.length;if(!docs.length)delete docCounts[cid];
    if(!document.getElementById("docList"))return;
    el.innerHTML=docs.length?docs.map(d=>`<div class="doc">
      <span class="ic">${d.kind==="file"?fileIcon(d.mime):DOC_IC[d.kind]}</span>
      <div class="bd">${docLink(d)}${statusBadge(d)}
        <div class="m">${d.kind==="file"?esc(d.filename)+" · "+fmtSize(d.size)+" · ":d.kind==="link"?esc(d.url)+" · ":""}${new Date(d.created_at*1000).toLocaleDateString("de-DE")}</div>
        ${d.kind==="note"&&noteRest(d)?`<div class="nb">${esc(noteRest(d))}</div>`:""}
        ${d.kind==="file"&&/^image\/(png|jpeg|gif|webp)$/.test(d.mime||"")?`<a href="${esc(docHref(d))}" target="_blank"><img class="th" loading="lazy" src="${esc(docHref(d))}" alt=""></a>`:""}
      </div>
      <button class="x" title="Von dieser Karte lösen" onclick="unlinkDoc('${cid}',${d.id})">✕</button></div>`).join("")
      :`<div class="hint">Noch keine Materialien.</div>`;
  }catch(e){el.innerHTML=`<div class="hint">Materialien konnten nicht geladen werden (offline?).</div>`;}
}
function pickFiles(cid,camera){
  const i=document.createElement("input");i.type="file";i.multiple=!camera;
  if(camera){i.accept="image/*";i.capture="environment";}
  i.onchange=()=>uploadFiles(cid,i.files);i.click();
}
function uploadOne(cid,f,row){
  return new Promise(res=>{
    const x=new XMLHttpRequest();
    x.open("POST",`/api/cards/${encodeURIComponent(cid)}/files`);
    x.setRequestHeader("X-Filename",encodeURIComponent(f.name||"foto.jpg"));
    x.setRequestHeader("Content-Type",f.type||"application/octet-stream");
    x.upload.onprogress=e=>{if(e.lengthComputable)row.querySelector("progress").value=e.loaded/e.total;};
    x.onload=()=>{let m="";try{m=JSON.parse(x.responseText).error||"";}catch(e){}
      if(x.status===200)row.remove();else row.innerHTML=`⚠️ ${esc(f.name)}: ${esc(m||"Fehler "+x.status)}`;res(x.status===200);};
    x.onerror=()=>{row.innerHTML=`⚠️ ${esc(f.name)}: Verbindung unterbrochen`;res(false);};
    x.send(f);
  });
}
async function uploadFiles(cid,files){
  if(!files||!files.length)return;
  const box=document.getElementById("upl")||document.getElementById("uplFloat");
  let ok=0;
  for(const f of Array.from(files)){
    const row=document.createElement("div");row.className="up";
    row.innerHTML=`⬆︎ ${esc(f.name)} (${fmtSize(f.size)})<progress max="1" value="0"></progress>`;
    box.appendChild(row);
    if(await uploadOne(cid,f,row))ok++;
  }
  if(ok){const c=state.cards.find(x=>x.id===cid);toast(`📎 ${ok} Datei${ok>1?"en":""} angehängt${c&&!document.getElementById("upl")?" an „"+c.t.slice(0,40)+"“":""}`);}
  if(document.getElementById("docList"))loadDocs(cid).then(()=>{if(activeView==="board")render();});
  else loadDocCounts().then(()=>{if(activeView==="board")render();});
}
function docForm(cid,kind){

async function mailSearch(cid){
  const el=document.getElementById("df_mres");if(!el)return;
  el.innerHTML=`<div class="hint">sucht in Outlook…</div>`;
  try{
    const r=await fetch("/api/mail/search?"+new URLSearchParams({q:document.getElementById("df_mq").value.trim(),n:15}));
    const d=await r.json();
    if(!r.ok){el.innerHTML=`<div class="hint">⚠️ ${esc(d.error||"Fehler")}${d.not_connected?` <a href="#" onclick="outlookDialog();return false" style="color:var(--acc)">Outlook verbinden</a>`:""}</div>`;return;}
    if(!d.length){el.innerHTML=`<div class="hint">Keine Mail gefunden.</div>`;return;}
    window._mails=d;
    el.innerHTML=d.map((m,i)=>`<div class="mr"><div class="bd"><b>${esc(m.subject)}</b>${m.has_attachments?" 📎":""}
      <small>${esc(m.from)} · ${m.date?new Date(m.date).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"}):""}${m.imported?" · schon im Cockpit":""}</small>

  }catch(e){el.innerHTML=`<div class="hint">⚠️ Keine Verbindung zum Server</div>`;}
}
async function mailImport(cid,i,btn){
  const m=(window._mails||[])[i];if(!m)return;
  btn.disabled=true;btn.textContent="…";
  try{
    const r=await fetch(`/api/cards/${encodeURIComponent(cid)}/mail`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message_id:m.id})});
    const d=await r.json();
    if(!r.ok){btn.disabled=false;btn.textContent="Anhängen";toast("⚠️ "+(d.error||"Fehler"));return;}
    btn.textContent="✓";m.imported=true;
    toast(d.already?"✉️ Mail war schon da – verknüpft":`✉️ Mail übernommen${d.attachments.length?" + "+d.attachments.length+" Anhang/Anhänge":""}`);
    await loadDocs(cid);if(activeView==="board")render();
  }catch(e){btn.disabled=false;btn.textContent="Anhängen";toast("⚠️ Keine Verbindung zum Server");}
}
let _olTimer=null;

  clearTimeout(_olTimer);
  let s={};
  try{const r=await fetch("/api/mail/status");s=await r.json();}catch(e){toast("⚠️ Keine Verbindung zum Server");return;}
  const lg=s.login||{};
  const body=!s.configured
    ?`<p class="hint">Die Microsoft-App ist auf dem Server noch nicht eingetragen (<code>MS_CLIENT_ID</code> in der .env). Anleitung: docs/OUTLOOK.md</p>`
    :lg.state==="pending"
    ?`<p>1. <a href="${esc(lg.verification_uri)}" target="_blank" rel="noopener" style="color:var(--acc)">${esc(lg.verification_uri)}</a> öffnen<br>

       <p class="hint">Anmeldung per Gerätecode: Du bekommst einen Code, gibst ihn bei Microsoft ein – fertig. Das Cockpit erhält nur Leserecht auf Mails.</p>`;
  document.getElementById("modal").innerHTML=`<h3>✉️ Outlook</h3>${body}
    <div class="modal-actions">
      ${s.configured&&s.connected?`<button class="btn" style="margin-right:auto;color:var(--steuer)" onclick="outlookLogout()">Trennen</button>`:""}

function saveCard(cid,exists){
